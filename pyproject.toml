[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mir-linter"
version = "0.3.0"
description = "Mitchell's Ineffable Rules (IR) Linter - A modular linter with customizable rules for SQL, Java, and XML."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.23.2,<0.24",
    "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
python = ["ruff>=0.12,<1"]
all = ["ruff>=0.12,<1"]

[project.scripts]
mir = "mir.main:main"
mir-linter = "mir.main:main"

[project.urls]
Homepage = "https://github.com/perdiesman/mitchells-ineffable-rules"
Repository = "https://github.com/perdiesman/mitchells-ineffable-rules"
"Bug Tracker" = "https://github.com/perdiesman/mitchells-ineffable-rules/issues"

[tool.setuptools.packages.find]
include = ["mir*"]

[tool.setuptools.package-data]
"mir.providers" = ["*.mjs"]
