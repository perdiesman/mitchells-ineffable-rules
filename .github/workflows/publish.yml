name: Publish to PyPI

"on":
  release:
    types:
      - published

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Validate release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          project_version="$(uv version --short)"
          source_version="$(python -c 'from mir import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$project_version"
          test "$source_version" = "$project_version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install locked dependencies
        run: uv sync --frozen --extra all

      - name: Run the complete unit suite
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py"

      - name: Verify generated documentation is current
        run: |
          uv run --frozen mir/main.py --help docs
          git diff --exit-code -- docs

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/mir-release-smoke"
          "$RUNNER_TEMP/mir-release-smoke/bin/pip" install dist/*.whl
          test "$("$RUNNER_TEMP/mir-release-smoke/bin/mir" --version)" = "mir-linter $(uv version --short)"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mir-linter
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  container:
    name: Publish versioned container
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/perdiesman/mir-linter:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker logout ghcr.io
          image="ghcr.io/perdiesman/mir-linter:$RELEASE_TAG"
          docker pull "$image"
          test "$(docker run --rm --network none "$image" --version)" = "mir-linter ${RELEASE_TAG#v}"
